name: CI

on:
  pull_request:
    branches: [master]

concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    uses: ./.github/workflows/build.yml

  version-check:
    name: Release preview
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Check pom version against tags
        run: |
          version=$(python3 -c "import xml.etree.ElementTree as E; print(E.parse('pom.xml').getroot().find('{http://maven.apache.org/POM/4.0.0}version').text.strip())")

          # 18.0.2-N are tags from the pre-2.0 scheme. Maven orders them above 2.x,
          # so they are left out of the "not lower than the highest tag" check.
          tags=$(git ls-remote --tags --refs origin | sed 's#.*refs/tags/##' | grep -v '^18\.0\.2-' || true)

          # Compare in version order (2.12 > 2.9).
          if ! result=$(.github/scripts/version-check.sh "$version" $tags); then
            highest=${result#highest=}
            message="pom.xml version $version is lower than the highest existing tag $highest"
            echo "### :x: $message" >> "$GITHUB_STEP_SUMMARY"
            echo "::error file=pom.xml,title=Release preview::$message"
            exit 1
          fi
          highest=${result#highest=}

          if printf '%s\n' $tags | grep -qxF "$version"; then
            message="No version bump; merging will not release"
            details="pom.xml version $version is already tagged."
          else
            message="Merging will release $version"
            details="pom.xml version $version is not tagged yet (highest tag: ${highest:-none})."
          fi

          # Shown in the step log, as an annotation on the PR check and run page, and in the job summary.
          echo "$message. $details"
          echo "::notice file=pom.xml,title=Release preview::$message. $details"
          printf '### %s\n%s\n' "$message" "$details" >> "$GITHUB_STEP_SUMMARY"
